name: Android and Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - run: rustup show
      - run: cargo fmt --manifest-path nativecore/Cargo.toml --check
      - run: cargo clippy --manifest-path nativecore/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path nativecore/Cargo.toml --locked
      - run: scripts/build-native.sh
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:data:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blockads-debug
          path: app/build/outputs/apk/debug/*.apk
