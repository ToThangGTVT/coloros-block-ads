name: Android and Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - run: rustup show
      - run: cargo fmt --manifest-path nativecore/Cargo.toml --check
      - run: cargo clippy --manifest-path nativecore/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path nativecore/Cargo.toml --locked -- --test-threads=1
      - run: scripts/build-native.sh
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:data:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blockads-debug
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/build-native.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 scripts/test-phase1.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: app/build/reports/androidTests/
