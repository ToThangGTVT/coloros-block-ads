name: Release APK

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check native code
        run: |
          rustup show
          cargo fmt --manifest-path nativecore/Cargo.toml --check
          cargo clippy --manifest-path nativecore/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path nativecore/Cargo.toml --locked -- --test-threads=1
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKADS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure BLOCKADS_KEYSTORE_BASE64 and the three signing secrets documented in docs/releases.md.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blockads-release.jks"
          chmod 600 "$RUNNER_TEMP/blockads-release.jks"
      - name: Build and verify signed release
        env:
          BLOCKADS_KEYSTORE_PATH: ${{ runner.temp }}/blockads-release.jks
          BLOCKADS_KEYSTORE_PASSWORD: ${{ secrets.BLOCKADS_KEYSTORE_PASSWORD }}
          BLOCKADS_KEY_ALIAS: ${{ secrets.BLOCKADS_KEY_ALIAS }}
          BLOCKADS_KEY_PASSWORD: ${{ secrets.BLOCKADS_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache -Pblockads.splitApks=true :app:assembleRelease :app:lintRelease :core:common:testDebugUnitTest :core:data:testDebugUnitTest
          for apk in app/build/outputs/apk/release/*-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Prepare APK and update metadata
        run: python3 scripts/prepare-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: blockads-release
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(python3 -c 'import json; print("v" + json.load(open("dist/update.json"))["versionName"])')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase versionName/versionCode before publishing another release."
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "BlockAds $TAG" --generate-notes --draft
          gh release edit "$TAG" --draft=false --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/blockads-release.jks"
