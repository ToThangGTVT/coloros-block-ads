[package]
name = "blockads-core"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "blockads_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.21.1", default-features = false }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"
