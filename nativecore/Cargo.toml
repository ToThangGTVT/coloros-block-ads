[workspace]
members = ["vendor/netstack-smoltcp"]
resolver = "2"

[package]
name = "blockads-core"
version = "0.5.0"
edition = "2021"
publish = false

[lib]
name = "blockads_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.21.1", default-features = false }

netstack-smoltcp = { version = "=0.2.4", path = "vendor/netstack-smoltcp" }
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
socket2 = "=0.6.5"
etherparse = "=0.16.0"
libc = "=0.2.191"
tracing = { version = "0.1", features = ["max_level_off"] }

hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "tls-ring", "https-ring", "quic-ring", "webpki-roots"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode-case"] }

rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "x509-parser", "zeroize"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.11"
hyper = { version = "=1.12.0", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
ring = "=0.17.14"

[[bench]]
name = "matcher"
harness = false

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"
