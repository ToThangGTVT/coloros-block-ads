[package]
name = "blockads-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "blockads_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.21.1", default-features = false }

netstack-smoltcp = "=0.2.4"
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
socket2 = "=0.6.5"
etherparse = "=0.16.0"
libc = "=0.2.191"
tracing = { version = "0.1", features = ["max_level_off"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"
